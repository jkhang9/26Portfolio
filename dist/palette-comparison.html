<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three palettes — Janice Khang</title><style>
@font-face{font-family:Geist;src:url('fonts/geist-regular.woff2')}@font-face{font-family:Crimson;src:url('fonts/crimson-pro-normal.woff2')}@font-face{font-family:Commit;src:url('fonts/commit-mono-regular.woff2')}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,4vw,64px);background:#fafafa;color:#222;font-family:Geist,sans-serif}header{margin-bottom:36px}h1{font-size:28px;font-weight:400;margin:12px 0}header p{font-size:16px;color:#555}a{color:inherit}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.sample{background:var(--bg);padding:72px 18px 20px;height:410px}.paper{height:100%;background:var(--paper);color:var(--ink);position:relative;padding:28px 22px;display:flex;flex-direction:column;justify-content:space-between}.tabs{position:absolute;display:flex;top:-34px;left:0;right:0;height:34px;gap:3px}.tabs span{background:var(--tab);color:var(--ink);border-radius:7px 7px 0 0;padding:10px 8px;font:11px Commit,monospace;flex:1;text-align:center;white-space:nowrap}.tabs span:last-child{background:var(--paper)}.meta{font:11px Commit,monospace;letter-spacing:.04em}.paper h2{font:24px Crimson,serif;line-height:1.05;margin:18px 0}.paper p{font-size:14px;line-height:1.5;max-width:210px}.paper footer{border-top:1px solid currentColor;padding-top:12px}.label{font-size:18px;font-weight:400;margin:20px 0 8px}.description{font-size:14px;line-height:1.5;min-height:42px}.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.swatch{height:30px;border:1px solid #0002}.hex{font:11px Commit,monospace;line-height:1.7}.role{font-size:12px;color:#666;margin-top:6px}@media(max-width:1000px){main{grid-template-columns:1fr}.sample{height:380px}.description{min-height:0}.paper p{max-width:360px}}
</style></head><body><header><a href="./">Back to journal</a><h1>Three directions in color</h1><p>The same paper, index tabs, and upright Crimson Pro. Three different moods.</p></header><main id="palettes"></main><script>
const palettes=[{name:'01 / Ink & butter',description:'Quiet and editorial. Deep navy gives the warm paper a crisp edge.',bg:'#252D3A',paper:'#F4F0DE',ink:'#252D3A',tab:'#BFC7D3'},{name:'02 / Oxblood & porcelain',description:'Rich and intimate. A wine-colored surround with pale porcelain paper.',bg:'#542C35',paper:'#F5F1EC',ink:'#38252A',tab:'#D9BCC2'},{name:'03 / Cobalt & chalk',description:'Bright and graphic. Saturated blue with cool paper and charcoal text.',bg:'#2348B5',paper:'#F5F5EF',ink:'#222A37',tab:'#BAC8EE'}];
document.getElementById('palettes').innerHTML=palettes.map(p=>`<article><div class="sample" style="--bg:${p.bg};--paper:${p.paper};--ink:${p.ink};--tab:${p.tab}"><div class="paper"><div class="tabs"><span>01 Work</span><span>02 Playground</span><span>03 About me</span></div><div class="meta">A LITTLE ABOUT ME</div><div><h2>Janice Khang.<br>Thoughtful things.<br>For real life.</h2><p>Product designer in Dallas, Texas. A little room to wander.</p></div><footer class="meta">ALWAYS A WORK IN PROGRESS.</footer></div></div><h2 class="label">${p.name}</h2><p class="description">${p.description}</p><div class="swatches">${[['Surround',p.bg],['Paper',p.paper],['Ink',p.ink]].map(([n,c])=>`<div><div class="swatch" style="background:${c}"></div><div class="role">${n}</div><div class="hex">${c}</div></div>`).join('')}</div></article>`).join('');
</script></body></html>
